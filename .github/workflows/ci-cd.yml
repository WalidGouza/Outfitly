# CI on every push and pull request; CD to production on pushes to main.
#
#   Frontend (Vercel)  deployed here with the Vercel CLI after all tests pass.
#   ML service (Modal) deployed here with `modal deploy` after all tests pass.
#   Backend (Render)   deployed by Render itself once this workflow's checks pass
#                      (render.yaml: autoDeployTrigger: checksPass).
#
# Deploys run only for the parts whose files changed. Secrets live in the
# "production" environment; see DEPLOYMENT.md > CI/CD.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Superseded PR runs are cancelled; a production deploy is never interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: outfitly_test
          POSTGRES_USER: outfitly
          POSTGRES_PASSWORD: outfitly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outfitly -d outfitly_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and PostgreSQL integration tests
        run: python -m pytest tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://outfitly:outfitly@localhost:5432/outfitly_test
      - name: Docker image builds
        run: docker build -t outfitly-api:ci .

  ml-service:
    name: ML service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      # Tests use a stub model, so PyTorch/sentence-transformers are skipped to keep CI fast.
      - run: |
          grep -v '^sentence-transformers' requirements.txt > "$RUNNER_TEMP/requirements-test.txt"
          pip install -r "$RUNNER_TEMP/requirements-test.txt" "modal>=1.6,<2"
      - run: python -m pytest tests -q
      - name: Modal app definition loads
        run: python -c "import modal_app"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          APP_ENV: prod
          VITE_API_URL: https://api.example.com

  changes:
    name: Detect changed parts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ml: ${{ steps.diff.outputs.ml }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A new branch or a force-push has no usable "before" commit: deploy everything.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "ml=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files"
          echo "ml=$(grep -q '^ml-service/' <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(grep -q '^frontend/' <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy-ml:
    name: Deploy ML service (Modal)
    needs: [backend, ml-service, frontend, changes]
    # Explicit result checks: "changes" is skipped on manual runs, which would otherwise skip this job.
    if: ${{ !cancelled() && needs.backend.result == 'success' && needs.ml-service.result == 'success' && needs.frontend.result == 'success' && github.ref == 'refs/heads/main' && (needs.changes.outputs.ml == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "modal>=1.6,<2"
      - run: modal deploy modal_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Smoke test
        if: vars.ML_SERVICE_URL != ''
        run: curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 "${{ vars.ML_SERVICE_URL }}/live"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [backend, ml-service, frontend, changes]
    # Explicit result checks: "changes" is skipped on manual runs, which would otherwise skip this job.
    if: ${{ !cancelled() && needs.backend.result == 'success' && needs.ml-service.result == 'success' && needs.frontend.result == 'success' && github.ref == 'refs/heads/main' && (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      # Run from the repository root: the Vercel project's Root Directory is frontend/.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
