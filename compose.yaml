# Local development stack. Production runs on Render (render.yaml) + Vercel + Supabase.
# The legacy project name preserves existing upload/model volumes.
name: outfitly-server

services:
  backend:
    build: ./backend
    init: true
    env_file: [./backend/.env]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      UPLOAD_DIR: /app/uploads
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - backend_uploads:/app/uploads
      # Source mounted read-only; Uvicorn reloads on change in dev.
      - ./backend/app:/app/app:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Opt-in: COMPOSE_PROFILES=ml in the root .env, plus ML_SERVICE_URL=http://ml-service:8001
  # and the shared ML_SERVICE_TOKEN in backend/.env and ml-service/.env.
  # Without it the core API still runs; uploads and outfit generation return 503.
  ml-service:
    profiles: [ml]
    build: ./ml-service
    init: true
    env_file: [./ml-service/.env]
    environment:
      APP_ENV: ${APP_ENV:-dev}
    ports: ["127.0.0.1:8001:8001"]
    volumes:
      # The model is baked into the image; only the source is mounted for reload.
      - ./ml-service/app:/app/app:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  backend_uploads:
