name: outfitly

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: outfitly
      POSTGRES_USER: outfitly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outfitly}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["outfitly_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outfitly"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  outfitly_data:
